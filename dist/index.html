<aside class="sidebar">
<a class="brand" href="#" aria-label="Echo home"><span class="brand-mark"><svg><use href="#i-disc"/></svg></span>echo<span class="brand-dot">.</span></a>

<nav class="side-nav" aria-label="Main navigation">
<button class="nav-item active" data-view="discover"><svg><use href="#i-disc"/></svg>音乐</button>
<button class="nav-item" data-view="search"><svg><use href="#i-search"/></svg>搜索</button>
<button class="nav-item" data-view="library"><svg><use href="#i-library"/></svg>资料库</button>

<div class="workspace">
<header class="topbar">
<a class="brand mobile-brand" href="#"><span class="brand-mark"><svg><use href="#i-disc"/></svg></span>echo<span class="brand-dot">.</span></a>
<div class="top-actions"><button class="account-button" id="account-btn">登录</button><button class="icon-btn" id="settings-btn" aria-label="设置"><svg><use href="#i-settings"/></svg></button></div>
</header>
<main id="main" tabindex="-1"></main>

<section class="player" aria-label="Music player">
<div class="mini-track"><button class="cover-button" id="expand-player" aria-label="Open now playing"><img id="mini-cover" src="assets/forest.jpg" alt="Sanctuary cover"></button><button class="mini-info" id="mini-info"><strong id="mini-title">Sanctuary</strong><span id="mini-artist">Scott Buckley</span></button><button class="icon-btn mini-like" id="mini-like" aria-label="Like current song"><svg><use href="#i-heart"/></svg></button></div>
<div class="playback"><div class="playback-buttons"><button class="icon-btn shuffle-btn" aria-label="Enable shuffle"><svg><use href="#i-shuffle"/></svg></button><button class="icon-btn prev-btn" aria-label="Previous song"><svg><use href="#i-prev"/></svg></button><button class="play-button toggle-play" aria-label="Play"><svg><use href="#i-play"/></svg></button><button class="icon-btn next-btn" aria-label="Next song"><svg><use href="#i-next"/></svg></button><button class="icon-btn repeat-btn" aria-label="Repeat off"><svg><use href="#i-repeat"/></svg><span class="repeat-one" hidden>1</span></button></div><div class="timeline"><span id="elapsed">0:00</span><input id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Playback position"><span id="duration">4:06</span></div></div>
<div class="player-tools"><span id="playback-status" role="status" hidden></span><button class="icon-btn" id="retry-playback" aria-label="Retry playback" hidden><svg><use href="#i-repeat"/></svg></button><button class="icon-btn" id="volume-toggle" aria-label="Mute"><svg><use href="#i-volume"/></svg></button><input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume"><button class="icon-btn" id="open-lyrics" aria-label="Open lyrics"><svg><use href="#i-lyrics"/></svg></button><span class="tool-divider"></span><button class="icon-btn queue-btn" aria-label="Open play queue"><svg><use href="#i-queue"/></svg></button></div>
<button class="icon-btn mobile-play toggle-play" aria-label="Play"><svg><use href="#i-play"/></svg></button><button class="icon-btn mobile-queue queue-btn" aria-label="Open play queue"><svg><use href="#i-queue"/></svg></button><div class="mini-progress"><span></span></div>
</section>
<nav class="bottom-nav" aria-label="主导航"><button class="active" data-view="discover"><svg><use href="#i-disc"/></svg><span>音乐</span></button><button data-view="search"><svg><use href="#i-search"/></svg><span>搜索</span></button><button data-view="library"><svg><use href="#i-library"/></svg><span>资料库</span></button></nav>

<dialog id="now-playing" aria-label="Now playing and lyrics"><div class="np-atmosphere" aria-hidden="true"></div><div class="np-top"><button class="icon-btn" id="close-now" aria-label="Close now playing"><svg><use href="#i-down"/></svg></button><div><small>ECHO</small><span>正在播放</span></div><div class="np-top-tools"><button class="icon-btn lyrics-toggle active-control" id="toggle-lyrics" aria-label="Toggle lyrics" aria-pressed="true"><svg><use href="#i-lyrics"/></svg></button><button class="icon-btn queue-btn" aria-label="Open play queue"><svg><use href="#i-queue"/></svg></button></div></div><div class="np-stage"><section class="np-deck" aria-label="Playback"><div id="np-video-slot" aria-hidden="true"></div><img id="np-cover" src="assets/forest.jpg" alt="Current album artwork"><div class="np-meta"><img id="np-inline-cover" src="assets/forest.jpg" alt="专辑封面"><div><h2 id="np-title">Sanctuary</h2><p id="np-artist">Scott Buckley</p></div><button class="icon-btn" id="np-like" aria-label="Like current song"><svg><use href="#i-heart"/></svg></button></div><div class="np-timeline"><input type="range" id="np-seek" min="0" max="100" value="0" step="0.1" aria-label="Playback position"><div><span id="np-elapsed">0:00</span><span id="np-duration">4:06</span></div></div><div class="np-controls"><button class="icon-btn shuffle-btn" aria-label="Enable shuffle"><svg><use href="#i-shuffle"/></svg></button><button class="icon-btn prev-btn" aria-label="Previous song"><svg><use href="#i-prev"/></svg></button><button class="play-button toggle-play" aria-label="Play"><svg><use href="#i-play"/></svg></button><button class="icon-btn next-btn" aria-label="Next song"><svg><use href="#i-next"/></svg></button><button class="icon-btn repeat-btn" aria-label="Repeat off"><svg><use href="#i-repeat"/></svg><span class="repeat-one" hidden>1</span></button></div><div class="np-bottom"><span></span><button class="icon-btn" id="track-actions" aria-label="Current song options"><svg><use href="#i-more"/></svg></button></div></section><section class="lyrics-panel" aria-label="Song lyrics"><div class="lyrics-heading"><span id="lyrics-status">LYRICS</span><button class="icon-btn" id="lyrics-options" aria-label="Lyrics options"><svg><use href="#i-more"/></svg></button></div><div class="lyrics-scroll" id="lyrics-scroll" tabindex="0" aria-label="Lyrics text"></div><div class="lyrics-footer"><a href="https:&#47;&#47;lrclib.net" target="_blank" rel="noopener" id="lyrics-credit">Lyrics via LRCLIB</a><button id="lyrics-follow" hidden>跟随歌词</button></div></section></div></dialog>
<section id="youtube-dock" hidden><div class="youtube-dock-head"><a id="youtube-origin-link" target="_blank" rel="noopener">YouTube</a><button id="youtube-open-player" class="icon-btn" aria-label="打开放大播放器"><svg><use href="#i-arrow"/></svg></button></div><div id="youtube-stage"><div id="youtube-player"></div><button id="youtube-activate" class="youtube-activate">播放 YouTube</button></div><div id="youtube-feedback" role="status" hidden></div></section>
<input type="file" id="lyrics-file-input" accept=".lrc,.txt,text/plain" hidden>
<input type="file" id="release-file-input" accept="audio/*,.mp3,.m4a,.wav,.ogg,.flac,.aac" hidden>
<input type="file" id="file-input" accept="audio/*,.mp3,.m4a,.wav,.ogg,.flac,.aac" multiple hidden>
