name: Deploy Echo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Write public client configuration
        run: node scripts/write-config.mjs
        env:
          ECHO_SUPABASE_URL: ${{ vars.ECHO_SUPABASE_URL }}
          ECHO_SUPABASE_ANON_KEY: ${{ vars.ECHO_SUPABASE_ANON_KEY }}
          ECHO_YOUTUBE_API_KEY: ${{ vars.ECHO_YOUTUBE_API_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
