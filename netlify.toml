[build]
  command = "node scripts/check-audio-build.mjs"
  publish = "audio-gateway-public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"
  NPM_FLAGS = "--ignore-scripts --omit=dev"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["youtubei.js", "quickjs-emscripten"]

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/api/audio*"
  [headers.values]
    Cache-Control = "no-store"
